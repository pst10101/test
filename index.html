<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교실 혼잡도</title>
<meta name="description" content="지금 어느 교실이 붐비는지 실시간으로 보여줘요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .top h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 7vw, 48px); line-height: 1.05; letter-spacing: -.01em; }
  .live { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--none); }
  .live[data-s="ok"] i { background: var(--free); }
  .live[data-s="bad"] i { background: var(--busy); }
  @media (prefers-reduced-motion: no-preference) { .live[data-s="ok"] i { animation: pulse 2s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: .35; } }

  .quiet { display: grid; gap: 10px; }
  .quiet h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .quiet-list { display: flex; gap: 8px; flex-wrap: wrap; }
  .quiet-list button { display: inline-flex; align-items: center; gap: 8px; background: var(--free-bg); color: var(--fg); border: 1px solid var(--free-edge); border-radius: 999px; min-height: 40px; padding: 6px 14px; font-weight: 500; }
  .quiet-list button b { font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--free); }
  .quiet-empty { margin: 0; color: var(--muted); font-size: 14px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
  .grades { display: flex; gap: 6px; flex-wrap: wrap; }

  .legend { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }

  /* 층별 지도 */
  .map { display: grid; gap: 14px; }
  .floor { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: stretch; }
  .floor-no { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-weight: 500; font-size: 13px; color: var(--muted); }
  .floor-no b { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--fg); }
  .hall { background: var(--hall); border-radius: 14px; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 128px), 1fr)); gap: 8px; min-width: 0; }
  .room {
    text-align: left; display: grid; gap: 4px; align-content: start;
    background: var(--l-bg); border: 1px solid var(--l-edge); border-radius: 12px;
    padding: 10px 12px 12px; min-height: 96px; font-weight: 400; min-width: 0;
  }
  .room-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .room-no { font-family: var(--font-display); font-size: 24px; line-height: 1.1; color: var(--fg); white-space: nowrap; flex: none; }
  .room-lv { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--l); white-space: nowrap; }
  .room-lv::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .room-title { font-size: 13.5px; line-height: 1.35; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .room.dim { opacity: .28; }

  /* 목록 */
  .list { display: grid; gap: 6px; }
  .row {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center;
    text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; font-weight: 400; min-height: 56px;
  }
  .row .pill { min-width: 72px; justify-content: center; }
  .row-main { display: grid; min-width: 0; }
  .row-main b { font-weight: 600; }
  .row-main span { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-meta { font-size: 13px; color: var(--muted); white-space: nowrap; text-align: right; }

  footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
  footer p { margin: 0; }

  /* 교실 상세 */
  dialog {
    border: 0; padding: 0; border-radius: 18px; width: 100%; max-width: min(460px, calc(100% - 32px));
    background: var(--surface); color: var(--fg); box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(8, 12, 20, .45); }
  .band { background: var(--l-bg); color: var(--l); padding: 18px 20px 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .band-lv { font-family: var(--font-display); font-size: 34px; line-height: 1; }
  .band-state { margin: 6px 0 0; font-size: 13.5px; font-weight: 500; }
  .x { min-height: 40px; min-width: 40px; padding: 0; border-radius: 50%; background: var(--surface); border: 0; color: var(--fg); font-size: 20px; line-height: 1; }
  .sheet { padding: 18px 20px 22px; display: grid; gap: 8px; }
  .sheet h3 { margin: 0; font-size: 22px; font-weight: 700; }
  .sheet p { margin: 0; }
  .sheet .desc { color: var(--fg); }
  .sheet dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
  .sheet dt { color: var(--muted); }
  .sheet dd { margin: 0; }
  @media (max-width: 520px) {
    dialog { margin: auto auto 0; max-width: 100%; border-radius: 18px 18px 0 0; }
    .sheet { padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
    .row-meta { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <p class="eyebrow" id="eventName"></p>
      <h1>교실 혼잡도</h1>
    </div>
    <span class="live" id="live" role="status"><i></i><span id="liveText">불러오는 중</span></span>
  </header>

  <p class="banner" id="demoBanner" hidden><b>예시 데이터로 보여주는 중이에요.</b> config.js에 Firebase 설정을 넣으면 실제 교실 상황으로 바뀌어요.</p>

  <section class="quiet" aria-labelledby="quietTitle">
    <h2 id="quietTitle">지금 한산한 곳</h2>
    <div class="quiet-list" id="quiet"></div>
  </section>

  <div class="toolbar">
    <div class="seg" role="tablist" aria-label="보기 방식">
      <button type="button" role="tab" id="tabMap" aria-selected="true" aria-controls="mapView">층별 지도</button>
      <button type="button" role="tab" id="tabList" aria-selected="false" aria-controls="listView">목록</button>
    </div>
    <div class="grades" id="grades" aria-label="학년 고르기"></div>
  </div>

  <div class="legend" aria-label="색깔 뜻">
    <span class="pill" data-l="free">여유</span>
    <span class="pill" data-l="normal">보통</span>
    <span class="pill" data-l="busy">혼잡</span>
    <span class="pill" data-l="none">정보 없음</span>
  </div>

  <p class="quiet-empty" id="emptyMsg" hidden></p>
  <section class="map" id="mapView" role="tabpanel" aria-labelledby="tabMap"></section>
  <section class="list" id="listView" role="tabpanel" aria-labelledby="tabList" hidden></section>

  <footer>
    <p>교실 카메라가 사람 수만 세서 자동으로 표시해요. 영상은 저장하지도, 보내지도 않아요.</p>
  </footer>
</div>

<dialog id="detail" aria-labelledby="dTitle">
  <div class="band" id="dBand">
    <div>
      <div class="band-lv" id="dLevel"></div>
      <p class="band-state" id="dState"></p>
    </div>
    <button type="button" class="x" id="dClose" aria-label="닫기">×</button>
  </div>
  <div class="sheet">
    <p class="eyebrow" id="dRoom"></p>
    <h3 id="dTitle"></h3>
    <p class="desc" id="dDesc"></p>
    <dl>
      <dt>운영 시간</dt><dd id="dHours"></dd>
      <dt>위치</dt><dd id="dWhere"></dd>
    </dl>
  </div>
</dialog>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  "use strict";
  var A = window.App;
  var $ = function (id) { return document.getElementById(id); };

  $("eventName").textContent = A.config.eventName || "";

  var statusMap = {}, infoMap = {};
  var gotStatus = false, gotInfo = false, connErr = false;
  var gradeSel = 0;
  var openId = null;

  // ---------- 보기 전환 ----------
  function setView(v) {
    var map = v === "map";
    $("tabMap").setAttribute("aria-selected", map ? "true" : "false");
    $("tabList").setAttribute("aria-selected", map ? "false" : "true");
    $("mapView").hidden = !map;
    $("listView").hidden = map;
    try { localStorage.setItem("congestion-view", v); } catch (e) {}
  }
  $("tabMap").addEventListener("click", function () { setView("map"); });
  $("tabList").addEventListener("click", function () { setView("list"); });
  try { if (localStorage.getItem("congestion-view") === "list") setView("list"); } catch (e) {}

  // ---------- 학년 필터 · 지도 · 목록 칸 만들기 ----------
  // 담당자가 교실을 추가·삭제하면 목록이 바뀌어요. 바뀔 때만 다시 만들어요.
  var gradeBtns = [], tiles = {}, rows = {};
  var builtSig = null, curList = [];

  function sigOf(list) {
    return list.map(function (r) { return [r.id, r.floor, r.grade, r.name].join("|"); }).join(",");
  }

  function build(list) {
    // 학년 필터
    var gl = A.grades(list);
    if (gradeSel && gl.indexOf(gradeSel) < 0) gradeSel = 0;
    $("grades").innerHTML = "";
    gradeBtns = [];
    [0].concat(gl).forEach(function (g) {
      var b = A.el("button", "chip", g ? g + "학년" : "전체");
      b.type = "button";
      b.setAttribute("aria-pressed", g === gradeSel ? "true" : "false");
      b.addEventListener("click", function () {
        gradeSel = g;
        gradeBtns.forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        render();
      });
      gradeBtns.push(b);
      $("grades").appendChild(b);
    });
    $("grades").hidden = gl.length < 2;

    // 층별 지도
    tiles = {}; rows = {};
    $("mapView").innerHTML = "";
    A.floors(list).forEach(function (f) {
      var sec = A.el("section", "floor");
      var h = A.el("h2", "floor-no");
      h.appendChild(A.el("b", null, String(f)));
      h.appendChild(document.createTextNode("층"));
      var hall = A.el("div", "hall");
      list.filter(function (r) { return r.floor === f; }).forEach(function (r) {
        var b = A.el("button", "room");
        b.type = "button";
        var top = A.el("span", "room-top");
        top.appendChild(A.el("span", "room-no", r.id));
        var lv = A.el("span", "room-lv");
        top.appendChild(lv);
        var t = A.el("span", "room-title");
        b.appendChild(top); b.appendChild(t);
        b.addEventListener("click", function () { openDetail(r.id); });
        hall.appendChild(b);
        tiles[r.id] = { btn: b, lv: lv, title: t };
      });
      sec.appendChild(h); sec.appendChild(hall);
      $("mapView").appendChild(sec);
    });

    // 목록 (칸은 만들어 두고, 순서는 render()가 정해요)
    $("listView").innerHTML = "";
    list.forEach(function (r) {
      var b = A.el("button", "row");
      b.type = "button";
      var pill = A.el("span", "pill");
      var main = A.el("span", "row-main");
      main.appendChild(A.el("b", null, r.name));
      var t = A.el("span");
      main.appendChild(t);
      var meta = A.el("span", "row-meta");
      b.appendChild(pill); b.appendChild(main); b.appendChild(meta);
      b.addEventListener("click", function () { openDetail(r.id); });
      rows[r.id] = { btn: b, pill: pill, title: t, meta: meta };
    });
    builtSig = sigOf(list);
  }

  // ---------- 화면 그리기 ----------
  function stateText(e, now) {
    if (e.source === "override") return "담당자가 직접 알려줬어요 · " + A.ago(e.at, now);
    if (e.source === "auto") return (typeof e.count === "number" ? "카메라 기준 약 " + e.count + "명 · " : "") + A.ago(e.at, now) + " 갱신";
    if (e.source === "stale") return "최근 소식이 없어요 · 마지막 " + A.ago(e.at, now);
    return "아직 정보가 없어요";
  }

  function render() {
    var now = Date.now();
    // 교실 목록(추가·삭제 반영)을 한 번 받은 뒤에 그려요. 지운 교실이 잠깐 보이는 걸 막기 위해서예요.
    var list = gotInfo ? A.mergeAll(infoMap) : [];
    if (sigOf(list) !== builtSig) build(list);
    var em = $("emptyMsg");
    em.hidden = list.length > 0;
    em.textContent = gotInfo ? "아직 등록된 교실이 없어요." : "교실 목록을 불러오는 중이에요.";
    curList = list;
    var items = list.map(function (r) { return { r: r, e: A.effective(statusMap[r.id], now) }; });
    var shown = function (it) { return !gradeSel || it.r.grade === gradeSel; };

    // 지도
    items.forEach(function (it) {
      var t = tiles[it.r.id];
      t.btn.dataset.l = A.levelKey(it.e.level);
      t.lv.textContent = A.levelLabel(it.e.level);
      t.title.textContent = it.r.title;
      t.btn.classList.toggle("dim", !shown(it));
      t.btn.setAttribute("aria-label", it.r.name + ", " + it.r.title + ", " + A.levelLabel(it.e.level));
    });

    // 목록 (한산한 순)
    var order = function (l) { return A.isLevel(l) ? l : 9; };
    items.slice().sort(function (a, b) {
      return order(a.e.level) - order(b.e.level) || (a.e.count || 0) - (b.e.count || 0) || a.r.id.localeCompare(b.r.id, "ko", { numeric: true });
    }).forEach(function (it) {
      var row = rows[it.r.id];
      row.btn.dataset.l = A.levelKey(it.e.level);
      row.pill.textContent = A.levelLabel(it.e.level);
      row.title.textContent = it.r.title;
      row.meta.textContent = it.r.floor + "층 · " + (it.e.at ? A.ago(it.e.at, now) : "정보 없음");
      row.btn.hidden = !shown(it);
      $("listView").appendChild(row.btn);
    });

    // 한산한 곳
    var q = $("quiet");
    q.innerHTML = "";
    var quiet = items.filter(function (it) { return it.e.level === 0 && shown(it); })
      .sort(function (a, b) { return (a.e.count || 0) - (b.e.count || 0); })
      .slice(0, 4);
    if (!gotStatus) {
      q.appendChild(A.el("p", "quiet-empty", "교실 상황을 불러오는 중이에요."));
    } else if (!list.length) {
      // 등록된 교실이 없을 땐 위쪽 안내만 보여줘요
    } else if (!quiet.length) {
      q.appendChild(A.el("p", "quiet-empty", "지금은 여유 있는 교실이 없어요. 조금 뒤에 다시 봐 주세요."));
    } else {
      quiet.forEach(function (it) {
        var b = A.el("button");
        b.type = "button";
        b.appendChild(A.el("b", null, it.r.id));
        b.appendChild(document.createTextNode(it.r.title));
        b.addEventListener("click", function () { openDetail(it.r.id); });
        q.appendChild(b);
      });
    }

    // 연결 상태
    var live = $("live");
    if (A.demo) { live.dataset.s = "ok"; $("liveText").textContent = "예시 데이터"; }
    else if (connErr) { live.dataset.s = "bad"; $("liveText").textContent = "연결 끊김 · 새로고침해 주세요"; }
    else if (gotStatus) { live.dataset.s = "ok"; $("liveText").textContent = "실시간 · " + A.clock(now) + " 기준"; }
    else { live.dataset.s = ""; $("liveText").textContent = "불러오는 중"; }

    if (openId) fillDetail(openId);
  }

  // ---------- 상세 ----------
  var dlg = $("detail");
  function fillDetail(id) {
    var now = Date.now();
    var r = null;
    curList.forEach(function (x) { if (x.id === id) r = x; });
    if (!r) { closeDetail(); return; }   // 보는 중에 담당자가 교실을 지운 경우
    var e = A.effective(statusMap[id], now);
    $("dBand").dataset.l = A.levelKey(e.level);
    $("dLevel").textContent = A.levelLabel(e.level);
    $("dState").textContent = stateText(e, now);
    $("dRoom").textContent = r.name;
    $("dTitle").textContent = r.title;
    $("dDesc").textContent = r.desc || "";
    $("dDesc").hidden = !r.desc;
    $("dHours").textContent = r.hours || "–";
    $("dWhere").textContent = r.floor + "층 " + r.name;
  }
  function openDetail(id) {
    openId = id;
    fillDetail(id);
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  }
  function closeDetail() { if (dlg.open) dlg.close(); }
  dlg.addEventListener("close", function () { openId = null; });
  $("dClose").addEventListener("click", closeDetail);
  dlg.addEventListener("click", function (ev) { if (ev.target === dlg) closeDetail(); });

  render();
  setInterval(render, 30000);
  // 교실 정보가 8초 안에 안 오면 config.js 기본 목록으로라도 보여줘요
  setTimeout(function () { if (!gotInfo) { gotInfo = true; render(); } }, 8000);

  // ---------- 데이터 연결 ----------
  if (A.demo) $("demoBanner").hidden = false;

  A.store().then(function (store) {
    var unsubs = [];
    function subscribe() {
      if (unsubs.length) return;
      unsubs.push(store.onStatus(function (m) { statusMap = m; gotStatus = true; connErr = false; render(); },
        function () { connErr = true; render(); }));
      unsubs.push(store.onRooms(function (m) { infoMap = m; gotInfo = true; render(); },
        function () { gotInfo = true; render(); }));
    }
    function unsubscribe() { unsubs.forEach(function (u) { try { u(); } catch (e) {} }); unsubs = []; }
    subscribe();

    // 화면을 안 보고 있으면 1분 뒤 연결을 끊어 무료 사용량을 아껴요
    var hideTimer = null;
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        hideTimer = setTimeout(unsubscribe, 60000);
      } else {
        clearTimeout(hideTimer);
        subscribe();
        render();
      }
    });
  }).catch(function () {
    connErr = true;
    gotInfo = true;
    render();
  });
})();
</script>
</body>
</html>
